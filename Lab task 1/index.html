<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Order Form</title>
</head>
<body>
    <h1>Create a HTML form following</h1>
    <form>
        <fieldset>
         <legend>Order Information</legend>
        <label>Product:</label>
        <select>
            <option>Product 1</option>
            <option>Product 2</option>
            <option>Product 3</option>
            <option>Product 4</option>
        </select>
        <br><br>

        <label>Quantity:</label>
        <input type="text">
        <br><br>

        <label>Full Name:</label>
        <input type="text">
        <br><br>

        <label>Email Address:</label>
        <input type="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="text">
        <br><br>

        <label>Address:</label> 
        <textarea rows="3" cols="30"></textarea>
        <br><br>

        <label>Billing Address:</label> 
        <textarea rows="3" cols="35"></textarea>
        <br><br>

        <label>Shipping Option:</label>
        <input type="radio" name="Shipping Option">
        <label>Standard Shipping</label>

        <input type="radio" name="Shipping Option">
        <label>Epress Shipping(addtional charge may apply)</label>
        <br>

        <label>Preferred Delivery Time:</label>
        <select>
            <option>Morning</option>
            <option>Evening</option>
            <option>Night</option>
        </select>
        <br>

        <label>Special Instruction:</label>
        <input type="text">
        <br>

        <input type="checkbox">
        <label>Request Express Shipping(addional charge may apply)</label>
        <input type="checkbox">
        <label>Gift Wrapping(additonal charge may apply)</label>
        <br>

        <label>I agree to the terms and conditions</label>
        <input type="checkbox">
        <tr>
        </tr>

             <td colspan = "2">
                <input type = "Submit">
                <input type = "Reset">

             </td>

    </fieldset>

    </form>




    
   
</body>
</html>
