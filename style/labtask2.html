<!DOCTYPE html>
<html lang="en">
<head>
  <title>Absolute Position Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 300px;
            height: 200px;
            border: 2px solid black;
            position: relative;
            margin: 50px;
            text-align: center;
        }

        .container h2 {
            margin-top: 80px;
        }

        .small-box {
            width: 80px;
            height: 50px;
            border: 2px solid black;
            position: absolute;
            bottom: 10px;
            right: 10px;
            text-align: center;
            line-height: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Absolute Position Example</h1>

    <div class="container">
        <h2>Container Area</h2>

        <div class="small-box">
            Bottom<br>Right
        </div>
    </div>


</body>
</html>
